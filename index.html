<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeeBakery บันทึกข้อมูล</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f7f9fa; padding: 15px; margin: 0; color: #333; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; }
        h2 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #f1f3f5; padding-bottom: 10px; font-size: 22px; }
        label { font-weight: bold; display: block; margin: 12px 0 6px 0; font-size: 16px; }
        input, select { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #ced4da; border-radius: 8px; font-size: 16px; background-color: #fff; }
        button { width: 100%; padding: 14px; background-color: #28a745; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:active { background-color: #218838; }
        .btn-scan { background-color: #007bff; margin-bottom: 10px; }
        .btn-scan:active { background-color: #0069d9; }
        .unit-group { display: flex; gap: 10px; }
        .unit-group input { flex: 2; }
        .unit-group select { flex: 1; }
    </style>
    <script>
        // --- ⚙️ รหัสเชื่อมต่อของมล (คงไว้ตามเดิม) ⚙️ ---
        const LIFF_ID = "2010106389-6Fsfdg2C"; 
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxYsXG8CSGDnclE3R9tdN0t4SQ5HghW5Ge71LsREHjym4839PIUel5cnUk37heb508R/exec";

        // ฟังก์ชันเริ่มระบบ LIFF และสั่งโหลดรายชื่อวัตถุดิบอัตโนมัติเมื่อเปิดแอป
        async function initLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    console.log("LINE Token Ready");
                    // 🚀 เรียกฟังก์ชันให้วิ่งไปดึงรายชื่อวัตถุดิบจากกูเกิลชีตมาใส่ Dropdown ทันที
                    loadMaterialsFromSheet();
                }
            } catch (error) {
                console.error("LIFF Initialization failed", error);
                alert("ระบบ LINE โหลดไม่สำเร็จ: " + error.message);
            }
        }

        // 🚀 ฟังก์ชันอัจฉริยะ: วิ่งไปดึงชื่อวัตถุดิบทั้งหมดใน Google Sheets มาสแตนด์บายรอในมือถือ
        async function loadMaterialsFromSheet() {
            try {
                const response = await fetch(WEB_APP_URL);
                const materials = await response.json();
                
                const datalist = document.getElementById('matList');
                datalist.innerHTML = ""; // ล้างข้อมูลเก่าออกก่อน
                
                // เอาชื่อที่ดึงมาได้ สร้างเป็นตัวเลือกค้นหาให้คุณแม่
                materials.forEach(mat => {
                    const option = document.createElement('option');
                    option.value = mat;
                    datalist.appendChild(option);
                });
                console.log("โหลดรายชื่อวัตถุดิบออโต้สำเร็จ!");
            } catch (error) {
                console.error("เกิดข้อผิดพลาดในการโหลดรายชื่อ:", error);
            }
        }

        // ฟังก์ชันเปิดกล้องสแกนบาร์โค้ด 
        async function scanBarcode() {
            if (!liff.isInClient()) {
                alert("กรุณาเปิดสแกนผ่านแอป LINE บนมือถือนะคะคุณแม่");
                return;
            }
            try {
                const result = await liff.scanCodeV2();
                if (result.value) {
                    document.getElementById('barcode').value = result.value;
                    alert("📷 สแกนติดแล้วค่ะ!\nรหัสบาร์โค้ดคือ: " + result.value);
                } else {
                    alert("กล้องเปิดสำเร็จ แต่ระบบยังจับภาพไม่ได้ ลองขยับระยะดูอีกทีนะคะคุณแม่");
                }
            } catch (err) {
                alert("เกิดข้อผิดพลาดในการสแกน: " + err.message);
            }
        }

        // ฟังก์ชันสลับโหมด พิมพ์เตือนคุณแม่กรณีจะเพิ่มวัตถุดิบชิ้นใหม่จริงๆ
        function toggleMatMode() {
            const mode = document.getElementById('matMode').value;
            const matNameInput = document.getElementById('matName');
            if (mode === "new") {
                alert("📢 คุณแม่กำลังเปิดโหมดเพิ่มวัตถุดิบชิ้นใหม่ที่ไม่เคยมีในร้านเลยนะคะ\n(กรุณาพิมพ์ชื่อสะกดให้ถูกต้องเพื่อใช้เป็นฐานข้อมูลในอนาคตค่ะ)");
                matNameInput.placeholder = "พิมพ์ชื่อวัตถุดิบใหม่ เช่น แป้งสาลีชนิดพิเศษ";
            } else {
                matNameInput.placeholder = "พิมพ์ค้นหาชื่อวัตถุดิบ... เช่น ผงโกโก้, แป้ง";
            }
        }

        // ฟังก์ชันส่งข้อมูล "ทำขนมประจำวัน"
        async function submitRecipe() {
            const data = {
                action: "makeRecipe",
                menuName: document.getElementById('menuName').value,
                qtyRecipe: document.getElementById('qtyRecipe').value,
                piecesSold: document.getElementById('piecesSold').value,
                pricePerPiece: document.getElementById('pricePerPiece').value
            };
            sendData(data);
        }

        // 🔥 ฟังก์ชันไฮไลท์: ตรวจเช็คการพิมพ์สะกดผิดก่อนจะยอมส่งข้อมูลไปหลังบ้าน
        async function checkAndSubmitMaterial() {
            const mode = document.getElementById('matMode').value;
            const nameInput = document.getElementById('matName').value.trim();
            
            if (!nameInput) {
                alert("กรุณากรอกชื่อวัตถุดิบด้วยค่ะคุณแม่");
                return;
            }

            // ดึงรายชื่อวัตถุดิบทั้งหมดที่มีอยู่ในระบบ ณ ตอนนั้นออกมารีเช็ค
            const datalist = document.getElementById('matList');
            const allowedMaterials = Array.from(datalist.options).map(opt => opt.value);

            // 🛑 ถ้าคุณแม่สั่งเติมสต็อกของเก่า แต่ดันสะกดชื่อผิด/พิมพ์ตกหล่น (ไม่ตรงกับในกูเกิลชีต)
            if (mode === "existing" && !allowedMaterials.includes(nameInput)) {
                alert("❌ [เกิดข้อผิดพลาดในการบันทึก]\nไม่พบวัตถุดิบชื่อ \"" + nameInput + "\" ในคลังหลักค่ะ!\n\n💡 แนะนำให้คุณแม่ลองพิมพ์ค้นหาและเลือกจากรายชื่อที่เด้งขึ้นมา หรือถ้าเป็นของใหม่ที่เพิ่งซื้อมาครั้งแรกจริงๆ ให้เปลี่ยนตัวเลือกด้านบนเป็น 'เพิ่มวัตถุดิบใหม่เข้าคลังครั้งแรก' นะคะ");
                return; // เบรกระบบทันที ข้อมูลขยะจะไม่ถูกส่งไปพังชีตแน่นอน
            }

            // ถ้าตรวจสอบเสร็จแล้วผ่านฉลุย ค่อยสั่งให้ทำงานส่งข้อมูลตามปกติ
            submitMaterial();
        }

        // ฟังก์ชันเตรียมโครงสร้างข้อมูลส่ง "ซื้อวัตถุดิบเข้าสต็อก"
        async function submitMaterial() {
            let qty = Number(document.getElementById('qtyBuy').value);
            const unit = document.getElementById('unitBuy').value;

            if (unit === "kg") { qty = qty * 1000; } 
            if (unit === "tsp") { qty = qty * 5; }    

            const data = {
                action: "buyMaterial",
                barcode: document.getElementById('barcode').value || "-",
                matName: document.getElementById('matName').value,
                qtyBuy: qty,
                priceBuy: document.getElementById('priceBuy').value
            };
            sendData(data);
        }

        // ฟังก์ชันยิงข้อมูลข้ามโลกไปหา Google Sheets
        function sendData(payload) {
            document.body.style.opacity = "0.5";
            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(response => {
                alert(response.message);
                liff.closeWindow(); 
            })
            .catch(err => {
                alert("เกิดข้อผิดพลาด: " + err);
                document.body.style.opacity = "1";
            });
        }

        // สั่งเริ่มระบบ LIFF ทันทีที่หน้าจอโหลดเสร็จ
        window.onload = initLiff;
    </script>
</head>
<body>

    <div class="card">
        <h2>🍰 บันทึกทำขนมประจำวัน</h2>
        <label>เลือกเมนูขนมที่ทำ</label>
        <select id="menuName">
            <option value="บราวนี่">บราวนี่</option>
            <option value="ปังเนยหนึบ">ปังเนยหนึบ</option>
        </select>

        <label>จำนวนสูตรที่ทำ (รอบ)</label>
        <input type="number" id="qtyRecipe" value="1" min="1">

        <label>จำนวนชิ้นที่ตัดได้จริง/ขายได้</label>
        <input type="number" id="piecesSold" placeholder="เช่น 65">

        <label>ราคาขายต่อชิ้น (บาท)</label>
        <input type="number" id="pricePerPiece" value="20">

        <button onclick="submitRecipe()">💾 บันทึกการทำขนม</button>
    </div>

    <div class="card">
        <h2>🛒 ซื้อของเข้าคลังสต็อก</h2>
        <button class="btn-scan" onclick="scanBarcode()">📷 กดปุ่มนี้เพื่อสแกนบาร์โค้ด</button>
        
        <label>รหัสบาร์โค้ด (ถ้ามี)</label>
        <input type="text" id="barcode" placeholder="สแกนเพื่อรับค่า หรือพิมพ์เอง">

        <label>ประเภทการบันทึกวัตถุดิบ</label>
        <select id="matMode" onchange="toggleMatMode()">
            <option value="existing">เติมสต็อกวัตถุดิบที่มีอยู่แล้ว (ตรวจสอบชื่ออัตโนมัติ)</option>
            <option value="new">🆕 เพิ่มวัตถุดิบใหม่เข้าคลังครั้งแรก</option>
        </select>

        <label>ชื่อวัตถุดิบ</label>
        <input type="text" id="matName" list="matList" placeholder="พิมพ์ค้นหาชื่อวัตถุดิบ... เช่น ผงโกโก้, แป้ง">
        <datalist id="matList">
            </datalist>

        <label>ปริมาณที่ซื้อ</label>
        <div class="unit-group">
            <input type="number" id="qtyBuy" placeholder="ใส่ตัวเลข">
            <select id="unitBuy">
                <option value="g">กรัม (g) / ชิ้น / ฟอง</option>
                <option value="kg">กิโลกรัม (kg)</option>
                <option value="tsp">ช้อนชา (tsp)</option>
            </select>
        </div>

        <label>ราคารวมที่จ่ายไป (บาท)</label>
        <input type="number" id="priceBuy" placeholder="เช่น 450">

        <button onclick="checkAndSubmitMaterial()" style="background-color: #007bff;">💾 บันทึกสต็อกเข้าคลัง</button>
    </div>

</body>
</html>
