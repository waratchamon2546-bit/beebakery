<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeeBakery บันทึกข้อมูล</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f7f9fa; padding: 15px; margin: 0; color: #333; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; }
        h2 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #f1f3f5; padding-bottom: 10px; font-size: 22px; }
        label { font-weight: bold; display: block; margin: 12px 0 6px 0; font-size: 16px; }
        input, select { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #ced4da; border-radius: 8px; font-size: 16px; background-color: #fff; }
        button { width: 100%; padding: 14px; background-color: #28a745; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:active { background-color: #218838; }
        .btn-scan { background-color: #007bff; margin-bottom: 10px; }
        .btn-scan:active { background-color: #0069d9; }
        .unit-group { display: flex; gap: 10px; }
        .unit-group input { flex: 2; }
        .unit-group select { flex: 1; }
        
        /* ตกแต่งกล่อง Select2 เพิ่มเติมให้เข้ากับดีไซน์เดิมของมล */
        .select2-container--default .select2-selection--single {
            height: 48px !important;
            border: 1px solid #ced4da !important;
            border-radius: 8px !important;
        }
        .select2-container--default .select2-selection--single .select2-selection__rendered {
            line-height: 46px !important;
            padding-left: 12px !important;
            font-size: 16px !important;
        }
        .select2-container--default .select2-selection--single .select2-selection__arrow {
            height: 46px !important;
        }
    </style>
    <script>
        // --- ⚙️ ตั้งค่ารหัสเชื่อมต่อตรงนี้ (ตามเดิมของมล) ⚙️ ---
        const LIFF_ID = "2010106389-6Fsfdg2C"; 
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz1Qnn8ch6knxYP7Ob3Ptzz5xD7PnhOy7ltHT7TEd0GW82U3egSVHMjFXSGvI241e2VSg/exec";

        // ฟังก์ชันเริ่มระบบ LIFF 
        async function initLiff() {
            try {
                await liff.init({ liffId: LIFF_ID });
                
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    console.log("LINE Token Ready");
                    // 🚀 สั่งโหลดรายชื่อวัตถุดิบล่าสุดจากชีตทันทีเมื่อเข้าระบบสำเร็จ
                    loadMaterialsFromSheet();
                }
            } catch (error) {
                console.error("LIFF Initialization failed", error);
                alert("ระบบ LINE โหลดไม่สำเร็จ: " + error.message);
            }
        }

        // 🚀 ส่วนที่เพิ่ม 2: ฟังก์ชันดึงรายชื่อจากกูเกิลชีตมาหยอดใส่กล่องทำ Autocomplete ค้นหาคำใกล้เคียง
        async function loadMaterialsFromSheet() {
            try {
                const response = await fetch(WEB_APP_URL);
                const materials = await response.json();
                
                const selectEl = document.getElementById('matName');
                
                // วนลูปนำชื่อวัตถุดิบทั้งหมดที่มีในชีตมาสร้างเป็นตัวเลือก
                materials.forEach(mat => {
                    const option = document.createElement('option');
                    option.value = mat;
                    option.textContent = mat;
                    selectEl.appendChild(option);
                });

                // 🔥 เปิดสวิตช์เปิดร่างระบบเดาคำอัจฉริยะ ค้นหาคำใกล้เคียงได้ทันที เช่น พิมพ์ "เน" เมนูเนยทั้งหมดจะเด้งขึ้นมา
                $('#matName').select2({
                    placeholder: "🔍 พิมพ์ค้นหาคำใกล้เคียง... เช่น เน, ผง, โก",
                    allowClear: true
                });
                
                console.log("เปิดระบบค้นหาเดาคำอัจฉริยะสำเร็จ!");
            } catch (error) {
                console.error("เกิดข้อผิดพลาดในการโหลดวัตถุดิบ:", error);
            }
        }

        // ฟังก์ชันเปิดกล้องสแกนบาร์โค้ด
        async function scanBarcode() {
            if (!liff.isInClient()) {
                alert("กรุณาเปิดสแกนผ่านแอป LINE บนมือถือนะคะคุณแม่");
                return;
            }
            try {
                const result = await liff.scanCodeV2();
                if (result.value) {
                    document.getElementById('barcode').value = result.value;
                    alert("📷 สแกนติดแล้วค่ะ!\nรหัสบาร์โค้ดคือ: " + result.value);
                } else {
                    alert("กล้องเปิดสำเร็จ แต่ระบบยังจับภาพไม่ได้ ลองขยับระยะดูอีกทีนะคะคุณแม่");
                }
            } catch (err) {
                alert("เกิดข้อผิดพลาดในการสแกน: " + err.message);
            }
        }

        // ฟังก์ชันสลับโหมด แสดงคำเตือนถ้าพิมพ์วัตถุดิบใหม่เข้าฐานข้อมูลครั้งแรก
        function toggleMatMode() {
            const mode = document.getElementById('matMode').value;
            
            if (mode === "new") {
                alert("📢 คุณแม่กำลังเปิดโหมดเพิ่มวัตถุดิบชิ้นใหม่ที่ไม่เคยมีในร้านเลยนะคะ\n(ระบบจะเปลี่ยนช่องกรอกเป็นแบบพิมพ์มือ เพื่อบันทึกชื่อวัตถุดิบใหม่เข้าฐานข้อมูลค่ะ)");
                // สลับแสดงผลกล่องพิมพ์มือธรรมดาแทน
                document.getElementById('matNameContainer').innerHTML = '<input type="text" id="matName" placeholder="พิมพ์ชื่อวัตถุดิบใหม่ เช่น แป้งสาลีชนิดพิเศษ">';
            } else {
                // เปลี่ยนกลับมาเป็นกล่องเลือก Autocomplete ชาญฉลาดเหมือนเดิม
                document.getElementById('matNameContainer').innerHTML = '<select id="matName" style="width: 100%;"><option value="">--- พิมพ์ค้นหาหรือเลือกชื่อวัตถุดิบ ---</option></select>';
                loadMaterialsFromSheet(); // โหลดข้อมูลมาหยอดใหม่
            }
        }

        // ฟังก์ชันส่งข้อมูล "ทำขนมประจำวัน"
        async function submitRecipe() {
            const data = {
                action: "makeRecipe",
                menuName: document.getElementById('menuName').value,
                qtyRecipe: document.getElementById('qtyRecipe').value,
                piecesSold: document.getElementById('piecesSold').value,
                pricePerPiece: document.getElementById('pricePerPiece').value
            };
            sendData(data);
        }

        // 🚀 ส่วนที่เพิ่ม 3: ฟังก์ชันดักเช็คการสะกดผิดก่อนส่งไปหา Google Sheets
        function checkAndSubmitMaterial() {
            const mode = document.getElementById('matMode').value;
            let nameInput = "";

            if (mode === "new") {
                nameInput = document.getElementById('matName').value.trim();
            } else {
                nameInput = $('#matName').val(); // ดึงค่าจากกล่องค้นหา Select2
            }
            
            if (!nameInput) {
                alert("กรุณาระบุชื่อวัตถุดิบด้วยค่ะคุณแม่");
                return;
            }

            // ถ้าเป็นการ "เติมสต็อกของเก่า" แต่พิมพ์ผิดจนไม่ตรงกับตัวเลือกใดๆ เลยในฐานข้อมูลชีต
            if (mode === "existing") {
                const selectEl = document.getElementById('matName');
                const allowedMaterials = Array.from(selectEl.options).map(opt => opt.value).filter(val => val !== "");
                
                if (!allowedMaterials.includes(nameInput)) {
                    alert("❌ [เกิดข้อผิดพลาดในการบันทึก]\nไม่พบวัตถุดิบชื่อ \"" + nameInput + "\" ในคลังหลักค่ะ!\n\n💡 แนะนำให้คุณแม่พิมพ์ค้นหาใหม่แล้วจิ้มเลือกรายการที่เด้งขึ้นมา หรือหากเป็นของใหม่ชิ้นแรกจริงๆ ให้เปลี่ยนประเภทด้านบนเป็น 'เพิ่มวัตถุดิบใหม่เข้าคลังครั้งแรก' นะคะ");
                    return; // เบรกระบบ ไม่ยอมส่งค่าขยะไปกวนตาราง
                }
            }

            // ถ้าผ่านเกณฑ์ ค่อยสั่งส่งข้อมูลตามปกติ
            submitMaterial(nameInput);
        }

        // ฟังก์ชันส่งข้อมูล "ซื้อวัตถุดิบเข้าสต็อก"
        async function submitMaterial(finalMatName) {
            let qty = Number(document.getElementById('qtyBuy').value);
            const unit = document.getElementById('unitBuy').value;

            if (unit === "kg") { qty = qty * 1000; } 
            if (unit === "tsp") { qty = qty * 5; }    

            const data = {
                action: "buyMaterial",
                barcode: document.getElementById('barcode').value || "-",
                matName: finalMatName,
                qtyBuy: qty,
                priceBuy: document.getElementById('priceBuy').value
            };
            sendData(data);
        }

        // ฟังก์ชันยิงข้อมูลข้ามโลกไปหา Google Sheets
        function sendData(payload) {
            document.body.style.opacity = "0.5";
            fetch(WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(response => {
                alert(response.message);
                liff.closeWindow(); 
            })
            .catch(err => {
                alert("เกิดข้อผิดพลาด: " + err);
                document.body.style.opacity = "1";
            });
        }

        window.onload = initLiff;
    </script>
</head>
<body>

    <div class="card">
        <h2>🍰 บันทึกทำขนมประจำวัน</h2>
        <label>เลือกเมนูขนมที่ทำ</label>
        <select id="menuName">
            <option value="บราวนี่">บราวนี่</option>
            <option value="ปังเนยหนึบ">ปังเนยหนึบ</option>
        </select>

        <label>จำนวนสูตรที่ทำ (รอบ)</label>
        <input type="number" id="qtyRecipe" value="1" min="1">

        <label>จำนวนชิ้นที่ตัดได้จริง/ขายได้</label>
        <input type="number" id="piecesSold" placeholder="เช่น 65">

        <label>ราคาขายต่อชิ้น (บาท)</label>
        <input type="number" id="pricePerPiece" value="20">

        <button onclick="submitRecipe()">💾 บันทึกการทำขนม</button>
    </div>

    <div class="card">
        <h2>🛒 ซื้อของเข้าคลังสต็อก</h2>
        <button class="btn-scan" onclick="scanBarcode()">📷 กดปุ่มนี้เพื่อสแกนบาร์โค้ด</button>
        
        <label>รหัสบาร์โค้ด (ถ้ามี)</label>
        <input type="text" id="barcode" placeholder="สแกนเพื่อรับค่า หรือพิมพ์เอง">

        <label>ประเภทการบันทึกวัตถุดิบ</label>
        <select id="matMode" onchange="toggleMatMode()">
            <option value="existing">เติมสต็อกวัตถุดิบที่มีอยู่แล้ว (ตรวจสอบชื่ออัตโนมัติ)</option>
            <option value="new">🆕 เพิ่มวัตถุดิบใหม่เข้าคลังครั้งแรก</option>
        </select>

        <label>ชื่อวัตถุดิบ</label>
        <div id="matNameContainer">
            <select id="matName" style="width: 100%;">
                <option value="">--- พิมพ์ค้นหาหรือเลือกชื่อวัตถุดิบ ---</option>
            </select>
        </div>

        <label>ปริมาณที่ซื้อ</label>
        <div class="unit-group">
            <input type="number" id="qtyBuy" placeholder="ใส่ตัวเลข">
            <select id="unitBuy">
                <option value="g">กรัม (g) / ชิ้น / ฟอง</option>
                <option value="kg">กิโลกรัม (kg)</option>
                <option value="tsp">ช้อนชา (tsp)</option>
            </select>
        </div>

        <label>ราคารวมที่จ่ายไป (บาท)</label>
        <input type="number" id="priceBuy" placeholder="เช่น 450">

        <button onclick="checkAndSubmitMaterial()" style="background-color: #007bff;">💾 บันทึกสต็อกเข้าคลัง</button>
    </div>

</body>
</html>
